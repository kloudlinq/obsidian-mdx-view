name: Build and release Obsidian plugin

on:
  push:
    tags:
      - "*" # e.g. 1.0.1 — triggers when a version tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint OIDC token for Sigstore
      attestations: write # publish the build provenance attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Attest plugin artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
